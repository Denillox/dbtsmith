[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbtsmith"
version = "0.1.0"
description = "Natural language to a validated dbt project"
requires-python = ">=3.13"

dependencies = [
    "pydantic>=2",
    "psycopg[binary]>=3",
    "python-dotenv>=1",
    "langchain>=0.3",
    "langchain-groq>=0.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
dbtsmith = "dbtsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]