[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbtsmith"
version = "0.1.0"
description = "Natural language to a validated dbt project"
requires-python = ">=3.13"

dependencies = [
    "pydantic>=2",
    "psycopg[binary]>=3",
    "python-dotenv>=1",
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "dbt-postgres>=1.10",
    "jinja2>=3",
    "pyyaml>=6",
    "click>=8",
    "pandas>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
dbtsmith = "dbtsmith.cli:generate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbtsmith = ["dbt_templates/*.jinja"]