[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbtsmith"
version = "0.1.0"
description = "Natural language to a validated dbt project"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
dbtsmith = "dbtsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]