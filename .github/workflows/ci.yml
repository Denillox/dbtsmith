name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbtsmith
          POSTGRES_PASSWORD: dbtsmith_dev
          POSTGRES_DB: dbtsmith_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: dbtsmith
      POSTGRES_PASSWORD: dbtsmith_dev
      POSTGRES_DB: dbtsmith_dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,ui]"
      - name: Load sample schema
        run: psql -h localhost -U dbtsmith -d dbtsmith_dev -f tests/fixtures/sample_schema.sql
        env:
          PGPASSWORD: dbtsmith_dev
      - run: pytest